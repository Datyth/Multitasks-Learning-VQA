# Single source of truth for the pilot. After changing data/tasks/train budget
# values, re-run `python src/prepare.py build` (train.sh refuses a stale dataset).

model: Qwen/Qwen3.5-4B            # fallback, only if necessary and documented: Qwen/Qwen3.5-2B
model_path: models/Qwen3.5-4B     # local checkpoint; nothing is downloaded implicitly
seed: 42
gpu: 0                            # nvidia-smi index (PCI bus order is enforced)

prompt_template: "<image>Answer the question using a short answer only: {question}"

paths:
  questions_zip: data/raw/questions1.2.zip
  images_zip: data/raw/images.zip
  processed_dir: data/processed
  images_dir: data/processed/images
  runs_dir: runs
  reports_dir: reports

data:
  train_questions_file: train_balanced_questions.json   # train pool + internal validation
  heldout_questions_file: val_balanced_questions.json   # held-out pilot test (NOT the GQA test set)
  internal_val_image_fraction: 0.1   # share of official-train images reserved for internal validation
  targets:                           # samples per task; targets, not assumed counts
    train_pool: 1000
    internal_val: 100
    test: 150

# Coarse operation-based diagnostic: membership uses real semantic[].operation steps.
grouping_operation: relate
tasks:
  T1: {structural: query, has_operation: false}
  T2: {structural: query, has_operation: true}
  T3: {structural: verify, has_operation: false}
  T4: {structural: verify, has_operation: true}

train:
  examples_per_task: 400
  effective_batch_size: 8
  micro_batch_size: 1              # gradient accumulation = effective / micro = 8
  learning_rate: 0.0001
  warmup_ratio: 0.05
  lora_rank: 8
  lora_alpha: 16
  target_modules: all-linear
  freeze_vit: true
  freeze_aligner: true
  max_length: 1024
  image_max_token_num: 256
  torch_dtype: bfloat16
  quant_method: bnb
  quant_bits: 4
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  logging_steps: 5
  dataloader_num_workers: 2
  eval_at_end: true                # one internal-validation loss pass at the final step
  smoke_steps: 3                   # at most 5; used only by `train.sh <id> --smoke`

evaluation:
  max_new_tokens: 16
  temperature: 0
  samples_per_task: 150
